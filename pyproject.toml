[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubic-mlp"
version = "0.1.0"
description = "Cardano-supervised MLP approximator for cubic equation roots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cubic_mlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

